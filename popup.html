<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSA AI Mentor Settings</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 320px;
      background-color: #0d1117;
      color: #c9d1d9;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #21262d;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
      color: #58a6ff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 10px;
      background-color: #238636;
      color: #ffffff;
      padding: 2px 6px;
      border-radius: 12px;
      font-weight: bold;
    }

    .section {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #8b949e;
      margin-bottom: 6px;
    }

    .input-group {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="password"], input[type="text"] {
      width: 100%;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px 32px 8px 10px;
      color: #c9d1d9;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #58a6ff;
    }

    .toggle-visibility {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      color: #8b949e;
      cursor: pointer;
      font-size: 14px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }

    .toggle-label {
      font-size: 13px;
      color: #c9d1d9;
    }

    /* Switch CSS */
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #30363d;
      transition: .3s;
      border-radius: 22px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #238636;
    }

    input:checked + .slider:before {
      transform: translateX(18px);
    }

    .btn-save {
      width: 100%;
      background-color: #238636;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 8px;
    }

    .btn-save:hover {
      background-color: #2ea043;
    }

    .status-msg {
      font-size: 12px;
      text-align: center;
      margin-top: 8px;
      min-height: 16px;
      color: #7ee787;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">🤖 DSA AI Mentor</div>
    <span class="badge">v2.0</span>
  </div>

  <div class="section">
    <label for="apiKey">Gemini API Key</label>
    <div class="input-group">
      <input type="password" id="apiKey" placeholder="sk-ant-api..." />
      <button type="button" class="toggle-visibility" id="toggleKey">👁️</button>
    </div>
  </div>

  <div class="section">
    <div class="toggle-row">
      <span class="toggle-label">Enable Mentor Sidebar</span>
      <label class="switch">
        <input type="checkbox" id="mentorEnabled" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label">Live Screen Capture</span>
      <label class="switch">
        <input type="checkbox" id="captureEnabled" checked />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <button class="btn-save" id="saveBtn">Save Settings</button>
  <div class="status-msg" id="statusMsg"></div>

  <script src="popup.js"></script>
</body>
</html>
